<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               img-src 'self';
               style-src 'unsafe-inline';
               base-uri 'none';
               form-action 'none';
               frame-ancestors 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="index, follow">
<meta name="description"
      content="Privacy policy for MONEU. No cookies, no tracking, no
               third party scripts, nothing stored about visitors.">
<title>Privacy · MONEU</title>

<style>
    :root {
        --bg:   #000000;
        --fg:   #ffffff;
        --dim:  #c8c8c8;
        --line: #3a3a3a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, "DejaVu Sans Mono", "Courier New",
                     monospace;
        font-size: 17px;
        font-weight: 700;
        line-height: 1.85;
        -webkit-font-smoothing: antialiased;
    }

    .logo {
        position: fixed;
        top: 22px; right: 22px;
        width: 92px; height: auto;
        opacity: 0.9; z-index: 5;
        pointer-events: none;
    }
    @media (max-width: 620px) {
        .logo { width: 62px; top: 14px; right: 14px; }
    }

    main {
        max-width: 760px;
        margin: 0 auto;
        padding: 6vh 22px 12vh;
        min-height: 100vh;
    }

    h1 {
        font-size: 1.5rem;
        letter-spacing: 0.3em;
        font-weight: 700;
        margin-bottom: 2.4rem;
    }

    h2 {
        font-size: 0.95rem;
        letter-spacing: 0.24em;
        font-weight: 700;
        color: var(--dim);
        margin: 2.8rem 0 1rem;
        border-bottom: 1px solid var(--line);
        padding-bottom: 0.5rem;
    }

    p { margin-bottom: 1.15rem; }

    .back {
        display: inline-block;
        border: 1px solid var(--line);
        color: var(--dim);
        font: inherit;
        font-size: 0.88rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        padding: 0.45rem 1.1rem;
        margin-top: 3rem;
        text-decoration: none;
    }
    .back:hover, .back:focus {
        color: var(--fg);
        border-color: var(--fg);
        outline: none;
    }

    footer {
        margin-top: 3.5rem;
        padding-top: 1.1rem;
        border-top: 1px solid var(--line);
        color: var(--dim);
        font-size: 0.84rem;
        letter-spacing: 0.1em;
    }
</style>
</head>

<body>
<img class="logo" src="logo.png" alt="MONEU">

<main>
    <h1>PRIVACY</h1>

    <p>This site sets no cookies and stores nothing about you.</p>


    <a class="back" href="index.html">BACK</a>

    <footer>MONEU &middot; EXPERIMENTAL &middot; NO WARRANTY</footer>
</main>
</body>
</html>
